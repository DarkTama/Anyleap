name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # tauri-action creates the Release and uploads assets

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Tag pushes release under the pushed tag; manual dispatch derives the
      # tag from tauri.conf.json (v<version>) and creates it at HEAD.
      - name: Resolve release tag
        id: tag
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $tag = '${{ github.ref_name }}'
          } else {
            $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
            $tag = "v$ver"
          }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sync version from git tag
        shell: pwsh
        run: |
          $ver = '${{ steps.tag.outputs.tag }}'.TrimStart('v')
          Write-Host "Syncing app version to $ver across manifests"

          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $ver
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

          $tconf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tconf.version = $ver
          $tconf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargo = $cargo -replace '(?m)^version = ".*"', "version = `"$ver`""
          Set-Content src-tauri/Cargo.toml $cargo

      - name: Generate release notes from git commits
        id: changelog
        shell: pwsh
        run: |
          $prevTag = git describe --tags --abbrev=0 HEAD^ 2>$null
          $repo = $env:GITHUB_REPOSITORY
          $ver = '${{ steps.tag.outputs.tag }}'.TrimStart('v')
          $tag = "v$ver"
          if ($prevTag) {
            $lines = git log "$prevTag..HEAD" --no-merges --pretty=format:"%s|%h"
          } else {
            $lines = git log -n 25 --no-merges --pretty=format:"%s|%h"
          }

          $feat = @(); $fix = @(); $other = @()
          foreach ($l in $lines) {
            if (-not $l) { continue }
            $s, $h = $l -split '\|', 2
            # skip release bumps and docs-only commits
            if ($s -match '^(chore\(release\)|docs)') { continue }
            $type = if ($s -match '^(\w+)') { $Matches[1] } else { '' }
            $s = $s -replace '^\w+(\([^)]*\))?!?:\s*', ''
            $item = "- $s ([$h](https://github.com/$repo/commit/$h))"
            switch ($type) {
              'feat'  { $feat  += $item }
              'fix'   { $fix   += $item }
              default { $other += $item }
            }
          }

          $sections = @()
          if ($feat)  { $sections += "### Features`n"      + ($feat  -join "`n") }
          if ($fix)   { $sections += "### Fixes`n"         + ($fix   -join "`n") }
          if ($other) { $sections += "### Other changes`n" + ($other -join "`n") }
          $log = if ($sections) { $sections -join "`n`n" } else { "- Maintenance and performance improvements" }

          $compare = if ($prevTag) { "**Full Changelog**: [$prevTag...$tag](https://github.com/$repo/compare/$prevTag...$tag)`n`n" } else { '' }

          $body = @"
          ## What's Changed

          $log

          $($compare)### Assets
          - ``AnyLeap_${ver}_x64-setup.exe`` — Windows installer
          - ``AnyLeap-${ver}-portable-win64.zip`` — Portable archive (unzip and run anyleap.exe)
          "@

          "body<<EOF`n$body`nEOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # Rust first: fetch-binaries.ps1 derives the target triple from rustc.
      - name: Setup Rust (stable-msvc)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      # postinstall runs scripts/fetch-binaries.ps1 (downloads + SHA-256-verifies
      # scrcpy v4.0 into src-tauri/binaries/) — the gitignored sidecars/resources.
      - name: Install deps (runs fetch-binaries via postinstall)
        run: npm ci

      - name: Ensure bundled binaries present
        run: npm run fetch-binaries

      # Builds the frontend + Rust, produces the NSIS installer, creates the
      # GitHub Release and uploads the installer with updater artifacts.
      - name: Build app + create Release (NSIS)
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_CLI_NO_VERSION_CHECK: "true"
        with:
          tagName: ${{ steps.tag.outputs.tag }}
          releaseName: 'AnyLeap ${{ steps.tag.outputs.tag }}'
          releaseDraft: false
          prerelease: false
          releaseBody: ${{ steps.changelog.outputs.body }}
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      # Assemble a portable ZIP that mirrors the bundler's resource layout, so
      # the same runtime path resolution in src-tauri/src/commands.rs succeeds.
      - name: Assemble portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rel = 'src-tauri/target/release'
          $bin = 'src-tauri/binaries'
          $ver = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $stage = Join-Path $env:RUNNER_TEMP 'portable'
          if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
          New-Item -ItemType Directory -Force -Path $stage, (Join-Path $stage 'scrcpy') | Out-Null

          Copy-Item "$rel/anyleap.exe" $stage -Force
          Copy-Item "$bin/adb-x86_64-pc-windows-msvc.exe"    $stage -Force
          Copy-Item "$bin/scrcpy-x86_64-pc-windows-msvc.exe" $stage -Force
          Copy-Item "$bin/dll/*.dll" $stage -Force
          Copy-Item "$bin/*.png"     $stage -Force
          Copy-Item "$bin/scrcpy-server" (Join-Path $stage 'scrcpy/scrcpy-server') -Force
          if (Test-Path "$rel/WebView2Loader.dll") { Copy-Item "$rel/WebView2Loader.dll" $stage -Force }

          $zip = "AnyLeap-$ver-portable-win64.zip"
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          "PORTABLE_ZIP=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload portable ZIP to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ steps.tag.outputs.tag }} "$env:PORTABLE_ZIP" --clobber
